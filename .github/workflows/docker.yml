name: Build and Deploy Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      PORT: 3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install backend dependencies
        run: npm ci
        working-directory: ./backend

      - name: Run backend tests
        run: npm run test -- --coverage --watchAll=false
        working-directory: ./backend

      - name: Run Prettier on backend
        run: |
          npx prettier --check "**/*.{ts,js,json,css,scss,md}" || { echo "Prettier check failed"; exit 1; }
        working-directory: ./backend

      - name: Run ESLint on backend
        run: npm run lint -- --max-warnings=0
        working-directory: ./backend

      - name: Run Prettier on frontend
        run: |
          npx prettier --check "**/*.{ts,tsx,js,jsx,json,css,scss,md}" || { echo "Prettier check failed"; exit 1; }
        working-directory: ./frontend

      - name: Run ESLint on frontend
        run: npm run lint -- --max-warnings=0
        working-directory: ./frontend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/warehouse-management-system:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/warehouse-management-system:${{ github.sha }}
          build-args: |
            REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }}

      - name: Trigger Render Deploy
        env:
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_DEPLOY_KEY: ${{ secrets.RENDER_DEPLOY_KEY }}
        run: |
          echo "Triggering Render deploy..."
          curl -X POST "https://api.render.com/deploy/${RENDER_SERVICE_ID}?key=${RENDER_DEPLOY_KEY}"